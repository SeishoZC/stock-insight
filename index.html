    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F3F4F6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, .selectable-text { user-select: text; }
        
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        
        .chart-main { height: 450px; max-height: 550px; }
        .chart-sub { height: 250px; max-height: 300px; }

        @media (max-width: 768px) {
            .chart-main { height: 350px; }
            .chart-sub { height: 200px; }
            body { padding-bottom: 80px; }

        .text-up { color: #EF4444; }
        .text-down { color: #10B981; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        icons: [{ src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAE1SURBVHhe7cExAQAAAMKg9U9tCy8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAziAAgKk0LHEAAAAASUVORK5CYII=", sizes: "192x192", type: "image/png" }]
    };
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest'; manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifestJSON)], { type: 'application/json' }));

            <!-- 第二排：主圖表 -->
            <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5 border border-gray-100">
                <div class="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            真實K線走勢
                            <span class="flex items-center text-[10px] sm:text-xs font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">
                                <span class="inline-block w-2 h-2 bg-yellow-400 rounded-full mr-1"></span> 5MA

                    </div>
                    <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 w-full sm:w-auto justify-between" id="timeFilters">

                        <button class="time-btn flex-1 sm:flex-none px-3 py-1.5 text-sm font-medium rounded-md text-gray-600 transition-colors" data-days="240">1年</button>

                </div>
                <div class="chart-container chart-main">
                    <canvas id="priceVolChart"></canvas>
                </div>
            </div>

            <!-- 第三排：副圖指標 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5 border border-gray-100">
                    <div class="mb-3 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-800">RSI (14日)</h3>
                        <span id="currentRSI" class="font-bold text-lg text-blue-600">--</span>
                    </div>
                    <div class="chart-container chart-sub"><canvas id="rsiChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5 border border-gray-100">
                    <div class="mb-3 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-800">KD (9日)</h3>
                        <div class="flex gap-4">
                            <span class="text-sm font-semibold" style="color: #F59E0B">K: <span id="currentK">--</span></span>
                            <span class="text-sm font-semibold" style="color: #8B5CF6">D: <span id="currentD">--</span></span>
                        </div>
                    </div>
                    <div class="chart-container chart-sub"><canvas id="kdChart"></canvas></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // 常用台股名稱對照表 (因為 API 有時只回傳代碼)
    const stockNames = {
        "2330": "台積電", "2317": "鴻海", "2454": "聯發科", "2308": "台達電", "2382": "廣達", 
        "2603": "長榮", "2881": "富邦金", "2882": "國泰金", "0050": "元大台灣50", "0056": "元大高股息",
        "3231": "緯創", "2356": "英業達", "2609": "陽明", "2615": "萬海", "2303": "聯電"
    };

    // 計算技術指標
    function calculateMA(prices, period) {
        let ma = [];
        for (let i = 0; i < prices.length; i++) {
            if (i < period - 1) ma.push(null);
            else {
                let sum = 0;
                for (let j = 0; j < period; j++) sum += prices[i - j];
                ma.push(parseFloat((sum / period).toFixed(2)));
            }
        }
        return ma;
    }

    function calculateRSI(prices, period = 14) {
        let rsi = new Array(prices.length).fill(null);
        if (prices.length < period) return rsi;
        let up = 0, down = 0;
        for(let i = 1; i <= period; i++) {
            let diff = prices[i] - prices[i-1];
            if(diff > 0) up += diff; else down -= diff;
        }
        up /= period; down /= period;
        rsi[period] = 100 - (100 / (1 + (up / (down === 0 ? 0.001 : down))));
        for (let i = period + 1; i < prices.length; i++) {
            let diff = prices[i] - prices[i-1];
            let currentUp = diff > 0 ? diff : 0;
            let currentDown = diff < 0 ? -diff : 0;
            up = (up * (period - 1) + currentUp) / period;
            down = (down * (period - 1) + currentDown) / period;
            let rs = up / (down === 0 ? 0.001 : down);
            rsi[i] = parseFloat((100 - (100 / (1 + rs))).toFixed(1));
        }
        return rsi;
    }

    function calculateKD(highs, lows, closes, period = 9) {
        let k = new Array(closes.length).fill(null), d = new Array(closes.length).fill(null);
        let prevK = 50, prevD = 50; 
        for(let i = period - 1; i < closes.length; i++) {
            let windowHighs = highs.slice(i - period + 1, i + 1);
            let windowLows = lows.slice(i - period + 1, i + 1);
            let maxH = Math.max(...windowHighs), minL = Math.min(...windowLows);
            let rsv = maxH === minL ? 50 : ((closes[i] - minL) / (maxH - minL)) * 100;
            let currK = (2/3) * prevK + (1/3) * rsv;
            let currD = (2/3) * prevD + (1/3) * currK;
            k[i] = parseFloat(currK.toFixed(1)); d[i] = parseFloat(currD.toFixed(1));
            prevK = currK; prevD = currD;
        }
        return {k, d};
    }

    let globalStockData = null; 
    let currentStockId = '';
    let currentTimeRange = 60;

    // --- 核心更新：同時抓取股價、基本面、新聞 ---
    async function fetchRealStockData(stockId) {
        const msgDiv = document.getElementById('statusMsg');
        const icon = document.getElementById('statusIcon');
        const text = document.getElementById('statusText');
        const dashboard = document.getElementById('dashboard');

        dashboard.classList.add('opacity-0');
        msgDiv.className = 'mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg text-sm flex items-center justify-center gap-2';
        icon.className = 'loader'; text.textContent = `正在連接證交所庫... (抓取 ${stockId} 報價、基本面與新聞)`;
        msgDiv.classList.remove('hidden');

        // 設定時間範圍
        const endDate = new Date().toISOString().split('T')[0];
        
        // 股價需要一年資料畫圖
        const startDateObj = new Date(); startDateObj.setFullYear(startDateObj.getFullYear() - 1);
        const startDatePrice = startDateObj.toISOString().split('T')[0];
        
        // 新聞和基本面只需要最近 30 天即可
        const shortDateObj = new Date(); shortDateObj.setDate(shortDateObj.getDate() - 30);
        const startDateShort = shortDateObj.toISOString().split('T')[0];

        // API 網址準備
        const urlPrice = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${stockId}&start_date=${startDatePrice}&end_date=${endDate}`;
        const urlPER = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPER&data_id=${stockId}&start_date=${startDateShort}&end_date=${endDate}`;
        const urlNews = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockNews&data_id=${stockId}&start_date=${startDateShort}&end_date=${endDate}`;

        try {
            // 同時發出三個 API 請求 (平行處理加速)
            const [resPrice, resPER, resNews] = await Promise.all([
                fetch(urlPrice), fetch(urlPER), fetch(urlNews)
            ]);

            const dataPrice = await resPrice.json();
            const dataPER = await resPER.json();
            const dataNews = await resNews.json();

            if (dataPrice.status === 200 && dataPrice.data && dataPrice.data.length > 0) {
                // 1. 處理股價與技術指標
                const rawData = dataPrice.data;
                const dates = [], prices = [], highs = [], lows = [], ohlc = [], volumes = [], colors = [];
                rawData.forEach(day => {
                    dates.push(day.date.substring(5)); 
                    prices.push(day.close); highs.push(day.max); lows.push(day.min);
                    ohlc.push({ o: day.open, h: day.max, l: day.min, c: day.close });
                    volumes.push(Math.round(day.Trading_Volume / 1000));
                    colors.push(day.close >= day.open ? '#EF4444' : '#10B981');
                });
                const rsi = calculateRSI(prices), kd = calculateKD(highs, lows, prices);
                const ma5 = calculateMA(prices, 5), ma10 = calculateMA(prices, 10), ma20 = calculateMA(prices, 20);

                globalStockData = {
                    ticker: stockId, name: stockNames[stockId] || `${stockId} 個股`,
                    dates, prices, ohlc, volumes, colors,
                    rsi, k: kd.k, d: kd.d, ma5, ma10, ma20
                };

                // 2. 處理基本面資料 (本益比、殖利率)
                if (dataPER.status === 200 && dataPER.data && dataPER.data.length > 0) {
                    const latestPER = dataPER.data[dataPER.data.length - 1]; // 取陣列最後一筆(最新)
                    document.getElementById('fundPE').textContent = latestPER.PER ? latestPER.PER.toFixed(2) : '--';
                    document.getElementById('fundYield').textContent = latestPER.dividend_yield ? latestPER.dividend_yield.toFixed(2) + '%' : '--%';
                    document.getElementById('fundPBR').textContent = latestPER.PBR ? latestPER.PBR.toFixed(2) + ' 倍' : '--';
                } else {
                    document.getElementById('fundPE').textContent = '--';
                    document.getElementById('fundYield').textContent = '--%';
                    document.getElementById('fundPBR').textContent = '--';
                }

                // 3. 處理最新新聞
                const newsUl = document.getElementById('newsList');
                if (dataNews.status === 200 && dataNews.data && dataNews.data.length > 0) {
                    // 反轉陣列讓最新的新聞在最上面，並取前 5 則
                    const latestNews = dataNews.data.reverse().slice(0, 5);
                    newsUl.innerHTML = latestNews.map(news => {
                        const dateStr = news.date.substring(5, 10); // 取出 MM-DD
                        return `
                        <li class="py-2 border-b border-gray-50 last:border-0 hover:bg-gray-50 transition-colors">
                            <a href="${news.link}" target="_blank" class="flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-gray-400 font-mono">${dateStr}</span>
                                    <span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 rounded border border-blue-100">${news.source}</span>
                                </div>
                                <span class="text-sm font-medium text-gray-700 hover:text-blue-600 line-clamp-1">${news.title}</span>
                            </a>
                        </li>`;
                    }).join('');
                } else {
                    newsUl.innerHTML = `<li class="py-4 text-sm text-gray-500 text-center">近期無重大相關新聞</li>`;
                }

                msgDiv.classList.add('hidden');
                dashboard.classList.remove('opacity-0');
                updateDashboardUI(currentTimeRange);

            } else { throw new Error("找不到股價資料"); }
        } catch (error) {
            console.error("API 錯誤:", error);
            msgDiv.className = 'mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center justify-center gap-2';
            icon.className = 'text-xl'; icon.textContent = '⚠️';
            text.textContent = `查無此代碼或連線失敗 (${stockId})。請輸入正確代碼，如: 2330, 2603`;
        }
    }


    let chartPriceVol, chartRSI, chartKD;
    const formatNumber = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    function initCharts() {
        Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
        Chart.defaults.color = '#9CA3AF';
        Chart.defaults.plugins.tooltip.mode = 'index';
        Chart.defaults.plugins.tooltip.intersect = false;

        const ctxPV = document.getElementById('priceVolChart').getContext('2d');
        chartPriceVol = new Chart(ctxPV, {
            type: 'bar', data: { labels: [], datasets: [] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.95)', titleColor: '#111827', bodyColor: '#374151',
                        borderColor: '#E5E7EB', borderWidth: 1, padding: 12,
                        callbacks: {
                            label: function(ctx) {
                                const ds = ctx.dataset;
                                if (ds.id === 'k-body') return `開: ${formatNumber(ctx.raw[0])} | 收: ${formatNumber(ctx.raw[1])} ${ctx.raw[1]>=ctx.raw[0]?'▲':'▼'}`;
                                if (ds.id === 'k-wick') return `高: ${formatNumber(ctx.raw[1])} | 低: ${formatNumber(ctx.raw[0])}`;
                                if (ds.id === 'vol') return `成交量: ${formatNumber(ctx.raw)} 張`;
                                if (ds.id === 'ma5') return `5MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                if (ds.id === 'ma10') return `10MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                if (ds.id === 'ma20') return `20MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                return null;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { maxTicksLimit: window.innerWidth < 600 ? 6 : 15 } },
                    y: { type: 'linear', display: true, position: 'left', grid: { color: '#F3F4F6' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, min: 0 }
                }
            }
        });

        const cOpt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 100, ticks: { stepSize: 20 } } } };
        chartRSI = new Chart(document.getElementById('rsiChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [] }, options: { ...cOpt, scales: { ...cOpt.scales, y: { ...cOpt.scales.y, grid: { color: (c) => [30, 70].includes(c.tick.value) ? 'rgba(239, 68, 68, 0.2)' : '#F3F4F6' } } } } });
        chartKD = new Chart(document.getElementById('kdChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [] }, options: { ...cOpt, scales: { ...cOpt.scales, y: { ...cOpt.scales.y, grid: { color: (c) => [20, 80].includes(c.tick.value) ? 'rgba(239, 68, 68, 0.2)' : '#F3F4F6' } } } } });
    }

    function updateDashboardUI(days) {
        if (!globalStockData) return;
        const data = globalStockData;
        const lastIdx = data.prices.length - 1;
        const sliceCount = Math.min(days, data.prices.length);

        const currentPrice = data.prices[lastIdx], prevPrice = data.prices[lastIdx - 1];
        const change = currentPrice - prevPrice, pctChange = (change / prevPrice) * 100;
        const colorClass = change >= 0 ? 'text-up' : 'text-down';

        document.getElementById('stockName').textContent = data.name;
        document.getElementById('stockTicker').textContent = data.ticker;
        
        const elPrice = document.getElementById('currentPrice');
        elPrice.textContent = formatNumber(currentPrice); elPrice.className = `text-5xl font-bold ${colorClass}`;
        const elChange = document.getElementById('priceChange');
        elChange.textContent = `${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}`; elChange.className = `text-lg font-semibold ${colorClass}`;
        const elPct = document.getElementById('percentChange');
        elPct.textContent = `(${change >= 0 ? '+' : ''}${pctChange.toFixed(2)}%)`; elPct.className = `text-sm font-medium ${colorClass}`;

        document.getElementById('currentRSI').textContent = data.rsi[lastIdx] ? data.rsi[lastIdx].toFixed(1) : '--';
        document.getElementById('currentK').textContent = data.k[lastIdx] ? data.k[lastIdx].toFixed(1) : '--';
        document.getElementById('currentD').textContent = data.d[lastIdx] ? data.d[lastIdx].toFixed(1) : '--';

        const slDates = data.dates.slice(-sliceCount), slOHLC = data.ohlc.slice(-sliceCount), slCol = data.colors.slice(-sliceCount), slVol = data.volumes.slice(-sliceCount);
        const slMA5 = data.ma5.slice(-sliceCount), slMA10 = data.ma10.slice(-sliceCount), slMA20 = data.ma20.slice(-sliceCount);
        const slRSI = data.rsi.slice(-sliceCount), slK = data.k.slice(-sliceCount), slD = data.d.slice(-sliceCount);

        const wicks = slOHLC.map(i => [i.l, i.h]), bodies = slOHLC.map(i => [i.o, i.c]);
        const allL = slOHLC.map(i => i.l), allH = slOHLC.map(i => i.h), pRange = Math.max(...allH) - Math.min(...allL);

        chartPriceVol.options.scales.y.min = Math.floor(Math.min(...allL) - pRange * 0.5);
        chartPriceVol.options.scales.y.max = Math.ceil(Math.max(...allH) + pRange * 0.1);
        chartPriceVol.options.scales.y1.suggestedMax = Math.max(...slVol) * 3.5;

        const isMobile = window.innerWidth < 600;
        const bPct = isMobile ? 0.9 : 0.8, cPct = isMobile ? 1.0 : 0.9;

        chartPriceVol.data.labels = slDates;
        chartPriceVol.data.datasets = [
            { id: 'ma5', type: 'line', data: slMA5, borderColor: '#FBBF24', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'ma10', type: 'line', data: slMA10, borderColor: '#06B6D4', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'ma20', type: 'line', data: slMA20, borderColor: '#A855F7', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'k-wick', type: 'bar', data: wicks, backgroundColor: slCol, barThickness: isMobile ? 1 : 2, grouped: false, yAxisID: 'y', order: 2 },
            { id: 'k-body', type: 'bar', data: bodies, backgroundColor: slCol, barPercentage: bPct, categoryPercentage: cPct, grouped: false, yAxisID: 'y', order: 1 },
            { id: 'vol', type: 'bar', data: slVol, backgroundColor: slCol.map(c => c + '66'), barPercentage: bPct, categoryPercentage: cPct, grouped: false, yAxisID: 'y1', order: 3 }
        ];
        chartPriceVol.update();

        chartRSI.data.labels = slDates; chartRSI.data.datasets = [{ data: slRSI, borderColor: '#2563EB', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }]; chartRSI.update();
        chartKD.data.labels = slDates; chartKD.data.datasets = [{ data: slK, borderColor: '#F59E0B', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }, { data: slD, borderColor: '#8B5CF6', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }]; chartKD.update();
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCharts(); 
        fetchRealStockData('2330');

        const handleSearch = () => {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            document.activeElement.blur(); 
            fetchRealStockData(q);
        };

        document.getElementById('searchBtn').addEventListener('click', handleSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

        const timeBtns = document.querySelectorAll('.time-btn');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(!globalStockData) return;
                timeBtns.forEach(b => b.classList.remove('active', 'bg-blue-600', 'text-white'));
                timeBtns.forEach(b => b.classList.add('text-gray-600'));
                e.target.classList.add('active', 'bg-blue-600', 'text-white');
                e.target.classList.remove('text-gray-600');
                currentTimeRange = parseInt(e.target.dataset.days);
                updateDashboardUI(currentTimeRange);
            });
        });
    });

    window.addEventListener('resize', () => {
        if(chartPriceVol) chartPriceVol.resize();
        if(chartRSI) chartRSI.resize();
        if(chartKD) chartKD.resize();
    });
</script>
</body>
</html>
