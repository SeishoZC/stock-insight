<!-- 動態注入 PWA 相關資源的腳本 (單檔架構核心) -->
<script>
    // 1. 動態建立 PWA Manifest
    const manifestJSON = {
        name: "StockInsight Pro 專業看盤",
        short_name: "StockInsight",
        description: "您的專屬台股技術分析儀表板",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#F3F4F6",
        theme_color: "#2563EB",
        icons: [{
            // 使用 Base64 單色圖標代替實體圖檔以符合單檔限制
            src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAE1SURBVHhe7cExAQAAAMKg9U9tCy8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAziAAgKk0LHEAAAAASUVORK5CYII=",
            sizes: "192x192",
            type: "image/png"
        }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestJSON)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);

    // 2. 動態註冊 Service Worker (PWA 的靈魂，支援離線與快取機制)
    const swCode = `
        self.addEventListener('install', (event) => {
            self.skipWaiting();
        });
        self.addEventListener('activate', (event) => {
            return self.clients.claim();
        });
        self.addEventListener('fetch', (event) => {
            // 由於是純前端展示，僅攔截並略過複雜的快取邏輯，確保 PWA 資格成立
            if (event.request.url.startsWith('http')) {
                event.respondWith(fetch(event.request).catch(() => new Response('Offline Mode')));
            }
        });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register(swUrl)
                .then((reg) => console.log('PWA Service Worker 註冊成功!', reg.scope))
                .catch((err) => console.log('Service Worker 註冊失敗:', err));
        });
    }
</script>

<script>
    // --- PWA 專屬邏輯：處理安裝按鈕顯示 ---
    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // 防止瀏覽器自動跳出預設的迷你資訊列
        e.preventDefault();
        // 將事件保存下來，稍後點擊按鈕時觸發
        deferredPrompt = e;
        // 顯示我們自訂的安裝橫幅
        installBanner.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            installBanner.classList.add('hidden'); // 隱藏橫幅
            deferredPrompt.prompt(); // 顯示系統原生安裝對話框
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
        }
    });

    window.addEventListener('appinstalled', () => {
        installBanner.classList.add('hidden');
        console.log('App 已成功安裝');
    });

    // --- 資料引擎與圖表邏輯 (延續前一版本的優良架構) ---
    function generateAllDates(days) {
        const dates = []; let d = new Date(); d.setDate(d.getDate() - (days * 1.5));
        while(dates.length < days) {
            d.setDate(d.getDate() + 1);
            if(d.getDay() !== 0 && d.getDay() !== 6) dates.push(`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`);
        }
        return dates;
    }
    const allDates = generateAllDates(250);

    function calculateMA(prices, period) {
        const ma = [];
        for (let i = 0; i < prices.length; i++) {
            if (i < period - 1) ma.push(null);
            else {
                let sum = 0; for (let j = 0; j < period; j++) sum += prices[i - j];
                ma.push(parseFloat((sum / period).toFixed(2)));
            }
        }
        return ma;
    }

    function generateStockHistory(startPrice, volatility, trend, days) {
        let prices = [], ohlc = [], volumes = [], colors = [], rsi = [], kData = [], dData = [];
        let currPrice = startPrice * (1 - trend * days), prevK = 50, prevD = 50;

        for (let i = 0; i < days; i++) {
            let change = (Math.random() - 0.5) * volatility + trend;
            let o = currPrice, c = o * (1 + change), h = Math.max(o, c) * (1 + Math.random() * volatility * 0.5), l = Math.min(o, c) * (1 - Math.random() * volatility * 0.5);
            o = parseFloat(o.toFixed(2)); h = parseFloat(h.toFixed(2)); l = parseFloat(l.toFixed(2)); c = parseFloat(c.toFixed(2));
            
            ohlc.push({ o, h, l, c }); prices.push(c); colors.push(c >= o ? '#EF4444' : '#10B981');
            let baseVol = startPrice > 500 ? 20 : 150;
            volumes.push(Math.floor(baseVol * (1 + (Math.random() - 0.5) * 0.8) + (Math.abs(change) * 1000)));

            let fakeRSI = Math.max(10, Math.min(90, 50 + (change / volatility) * 35 + (Math.random()-0.5)*10));
            rsi.push(parseFloat(fakeRSI.toFixed(1)));

            let rsv = Math.max(0, Math.min(100, 50 + (change / volatility) * 45));
            let currK = (2/3) * prevK + (1/3) * rsv, currD = (2/3) * prevD + (1/3) * currK;
            kData.push(parseFloat(currK.toFixed(1))); dData.push(parseFloat(currD.toFixed(1)));
            prevK = currK; prevD = currD; currPrice = c;
        }
        return { ohlc, prices, volumes, colors, rsi, k: kData, d: dData, ma5: calculateMA(prices, 5), ma10: calculateMA(prices, 10), ma20: calculateMA(prices, 20) };
    }

    const stockDB = {
        "2330": {
            ticker: "2330", name: "台積電", sector: "半導體", cap: "230,000",
            fundamentals: { pe: "22.5", yield: "1.8%", eps: "38.50", roe: "28.5%" },

            history: generateStockHistory(2290, 0.025, 0.001, 250)
        },

            fundamentals: { pe: "14.2", yield: "4.5%", eps: "11.20", roe: "10.5%" },
            institutional: { foreign: "-5,200", trust: "+1,200", dealer: "+450" },
            news: [{ date: "5小時前", title: "AI 伺服器出貨放量，營收創同期新高", source: "財經網" }, { date: "昨天", title: "蘋果新機備貨啟動，鄭州廠擴大招工", source: "經濟報" }],
            history: generateStockHistory(155, 0.03, 0.0005, 250)
        },
        "2454": {
            ticker: "2454", name: "聯發科", sector: "半導體", cap: "18,200",
            fundamentals: { pe: "18.5", yield: "5.2%", eps: "60.50", roe: "22.1%" },
            institutional: { foreign: "+2,100", trust: "-300", dealer: "-150" },
            news: [{ date: "1小時前", title: "天璣 9400 跑分曝光，效能超車競品", source: "科技報" }, { date: "昨天", title: "第三季財測優於預期，手機市場回溫", source: "財經網" }],

    let chartPriceVol, chartRSI, chartKD, currentStockId = '2330', currentTimeRange = 60;
    const formatNumber = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    function initCharts() {
        Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
        Chart.defaults.color = '#9CA3AF';
        Chart.defaults.plugins.tooltip.mode = 'index';
        Chart.defaults.plugins.tooltip.intersect = false;

        const ctxPV = document.getElementById('priceVolChart').getContext('2d');
        chartPriceVol = new Chart(ctxPV, {
            type: 'bar', data: { labels: [], datasets: [] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.95)', titleColor: '#111827', bodyColor: '#374151',
                        borderColor: '#E5E7EB', borderWidth: 1, padding: 12,
                        callbacks: {
                            label: function(ctx) {
                                const ds = ctx.dataset;
                                if (ds.id === 'k-body') return `開: ${formatNumber(ctx.raw[0])} | 收: ${formatNumber(ctx.raw[1])} ${ctx.raw[1]>=ctx.raw[0]?'▲':'▼'}`;
                                if (ds.id === 'k-wick') return `高: ${formatNumber(ctx.raw[1])} | 低: ${formatNumber(ctx.raw[0])}`;
                                if (ds.id === 'vol') return `成交量: ${formatNumber(ctx.raw)} 千股`;
                                if (ds.id === 'ma5') return `5MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                if (ds.id === 'ma10') return `10MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                if (ds.id === 'ma20') return `20MA: ${ctx.raw!==null?formatNumber(ctx.raw):'-'}`;
                                return null;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { maxTicksLimit: window.innerWidth < 600 ? 6 : 15 } },
                    y: { type: 'linear', display: true, position: 'left', grid: { color: '#F3F4F6' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, min: 0 }
                }
            }
        });

        const cOpt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 100, ticks: { stepSize: 20 } } } };
        chartRSI = new Chart(document.getElementById('rsiChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [] }, options: { ...cOpt, scales: { ...cOpt.scales, y: { ...cOpt.scales.y, grid: { color: (c) => [30, 70].includes(c.tick.value) ? 'rgba(239, 68, 68, 0.2)' : '#F3F4F6' } } } } });
        chartKD = new Chart(document.getElementById('kdChart').getContext('2d'), { type: 'line', data: { labels: [], datasets: [] }, options: { ...cOpt, scales: { ...cOpt.scales, y: { ...cOpt.scales.y, grid: { color: (c) => [20, 80].includes(c.tick.value) ? 'rgba(239, 68, 68, 0.2)' : '#F3F4F6' } } } } });
    }

    function updateDashboard(stockId, days) {
        const stock = stockDB[stockId];
        if (!stock) return false;
        currentStockId = stockId;
        const hist = stock.history, lastIdx = hist.prices.length - 1;
        const currentPrice = hist.prices[lastIdx], prevPrice = hist.prices[lastIdx - 1];
        const change = currentPrice - prevPrice, pctChange = (change / prevPrice) * 100;

        const colorClass = change >= 0 ? 'text-up' : 'text-down';
        document.getElementById('stockName').textContent = stock.name;
        document.getElementById('stockTicker').textContent = stock.ticker;
        document.getElementById('stockSector').textContent = stock.sector;
        
        const elPrice = document.getElementById('currentPrice');
        elPrice.textContent = formatNumber(currentPrice); elPrice.className = `text-5xl font-bold ${colorClass}`;
        const elChange = document.getElementById('priceChange');
        elChange.textContent = `${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}`; elChange.className = `text-lg font-semibold ${colorClass}`;
        const elPct = document.getElementById('percentChange');
        elPct.textContent = `(${change >= 0 ? '+' : ''}${pctChange.toFixed(2)}%)`; elPct.className = `text-sm font-medium ${colorClass}`;

        document.getElementById('fundPE').textContent = stock.fundamentals.pe;
        document.getElementById('fundYield').textContent = stock.fundamentals.yield;
        document.getElementById('fundEPS').textContent = stock.fundamentals.eps;
        document.getElementById('fundROE').textContent = stock.fundamentals.roe;
        
        const upInst = (id, val) => { const el = document.getElementById(id); el.textContent = val + " 張"; el.className = `font-bold text-lg ${val.includes('-') ? 'text-down' : 'text-up'}`; };
        upInst('instForeign', stock.institutional.foreign); upInst('instTrust', stock.institutional.trust); upInst('instDealer', stock.institutional.dealer);

        document.getElementById('currentRSI').textContent = hist.rsi[lastIdx].toFixed(1);
        document.getElementById('currentK').textContent = hist.k[lastIdx].toFixed(1);
        document.getElementById('currentD').textContent = hist.d[lastIdx].toFixed(1);

        document.getElementById('newsList').innerHTML = stock.news.map(n => `
            <li class="py-3 flex flex-col sm:flex-row sm:items-center gap-2 hover:bg-gray-50 transition-colors rounded cursor-pointer border-b border-gray-50 last:border-0">
                <span class="text-xs text-gray-400 min-w-[60px]">${n.date}</span>
                <span class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded border border-blue-100 whitespace-nowrap self-start sm:self-auto">${n.source}</span>
                <span class="text-sm font-medium text-gray-700 hover:text-blue-600 line-clamp-2">${n.title}</span>
            </li>`).join('');

        const slDates = allDates.slice(-days), slOHLC = hist.ohlc.slice(-days), slCol = hist.colors.slice(-days), slVol = hist.volumes.slice(-days);
        const slMA5 = hist.ma5.slice(-days), slMA10 = hist.ma10.slice(-days), slMA20 = hist.ma20.slice(-days), slRSI = hist.rsi.slice(-days), slK = hist.k.slice(-days), slD = hist.d.slice(-days);

        const wicks = slOHLC.map(i => [i.l, i.h]), bodies = slOHLC.map(i => [i.o, i.c]);
        const allL = slOHLC.map(i => i.l), allH = slOHLC.map(i => i.h), pRange = Math.max(...allH) - Math.min(...allL);

        chartPriceVol.options.scales.y.min = Math.floor(Math.min(...allL) - pRange * 0.5);
        chartPriceVol.options.scales.y.max = Math.ceil(Math.max(...allH) + pRange * 0.1);
        chartPriceVol.options.scales.y1.suggestedMax = Math.max(...slVol) * 3.5;

        // 判斷手機版或電腦版決定 K 棒粗細
        const isMobile = window.innerWidth < 600;
        const bPct = isMobile ? 0.9 : 0.8, cPct = isMobile ? 1.0 : 0.9;

        chartPriceVol.data.labels = slDates;
        chartPriceVol.data.datasets = [
            { id: 'ma5', type: 'line', data: slMA5, borderColor: '#FBBF24', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'ma10', type: 'line', data: slMA10, borderColor: '#06B6D4', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'ma20', type: 'line', data: slMA20, borderColor: '#A855F7', borderWidth: 2, pointRadius: 0, yAxisID: 'y', order: 0, tension: 0.2 },
            { id: 'k-wick', type: 'bar', data: wicks, backgroundColor: slCol, barThickness: isMobile ? 1 : 2, grouped: false, yAxisID: 'y', order: 2 },
            { id: 'k-body', type: 'bar', data: bodies, backgroundColor: slCol, barPercentage: bPct, categoryPercentage: cPct, grouped: false, yAxisID: 'y', order: 1 },
            { id: 'vol', type: 'bar', data: slVol, backgroundColor: slCol.map(c => c + '66'), barPercentage: bPct, categoryPercentage: cPct, grouped: false, yAxisID: 'y1', order: 3 }
        ];
        chartPriceVol.update();

        chartRSI.data.labels = slDates; chartRSI.data.datasets = [{ data: slRSI, borderColor: '#2563EB', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }]; chartRSI.update();
        chartKD.data.labels = slDates; chartKD.data.datasets = [{ data: slK, borderColor: '#F59E0B', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }, { data: slD, borderColor: '#8B5CF6', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }]; chartKD.update();
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCharts(); updateDashboard(currentStockId, currentTimeRange);

        const handleSearch = () => {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            let fId = Object.keys(stockDB).find(id => id === q || stockDB[id].name.includes(q));
            if (fId) { document.getElementById('errorMsg').classList.add('hidden'); document.activeElement.blur(); updateDashboard(fId, currentTimeRange); } 
            else document.getElementById('errorMsg').classList.remove('hidden');
        };

        document.getElementById('searchBtn').addEventListener('click', handleSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

        const timeBtns = document.querySelectorAll('.time-btn');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                timeBtns.forEach(b => b.classList.remove('active', 'bg-blue-600', 'text-white'));
                timeBtns.forEach(b => b.classList.add('text-gray-600'));
                e.target.classList.add('active', 'bg-blue-600', 'text-white');
                e.target.classList.remove('text-gray-600');
                currentTimeRange = parseInt(e.target.dataset.days);
                updateDashboard(currentStockId, currentTimeRange);
            });
        });
        document.querySelector(`.time-btn[data-days="${currentTimeRange}"]`).classList.add('active', 'bg-blue-600', 'text-white');
    });

    // 視窗大小改變時重新整理圖表佈局
    window.addEventListener('resize', () => {
        if(chartPriceVol) chartPriceVol.resize();
        if(chartRSI) chartRSI.resize();
        if(chartKD) chartKD.resize();
    });
</script>
</body>
</html>
